  <g fill="none" stroke="#c8862a" stroke-width="7" stroke-linecap="round">
    <ellipse cx="106" cy="86" rx="26" ry="10"/>
    <ellipse cx="106" cy="106" rx="26" ry="10"/>
    <ellipse cx="106" cy="126" rx="26" ry="10"/>
    <ellipse cx="106" cy="146" rx="26" ry="10"/>
  </g>
  <!-- secondary coil (navy) right leg -->
  <g fill="none" stroke="#1b2a41" stroke-width="7" stroke-linecap="round">
    <ellipse cx="150" cy="96" rx="26" ry="10"/>
    <ellipse cx="150" cy="116" rx="26" ry="10"/>
    <ellipse cx="150" cy="136" rx="26" ry="10"/>
