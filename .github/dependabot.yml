version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      electron-toolchain:
        patterns: ["electron", "electron-builder"]
    ignore:
      # Major Electron upgrades are planned deliberately, not merged automatically.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/android-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
    ignore:
      # A Capacitor major release needs a native project migration.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [dependencies, ci]
